name: Apply training sequence fixes

on:
  push:
    branches:
      - sync/server-working-20260627

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/server-working-20260627
          fetch-depth: 0

      - name: Apply tested Training fixes
        shell: python
        run: |
          from pathlib import Path

          def function_range(source, signature):
              start = source.index(signature)
              open_pos = source.index('{', start)
              depth = 0
              state = 'code'
              escaped = False
              i = open_pos

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''

                  if state in ('single', 'double'):
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif state == 'single' and ch == "'":
                          state = 'code'
                      elif state == 'double' and ch == '"':
                          state = 'code'
                      i += 1
                      continue

                  if state == 'line':
                      if ch == '\n':
                          state = 'code'
                      i += 1
                      continue

                  if state == 'block':
                      if ch == '*' and nxt == '/':
                          state = 'code'
                          i += 2
                          continue
                      i += 1
                      continue

                  if ch == "'":
                      state = 'single'
                  elif ch == '"':
                      state = 'double'
                  elif ch == '/' and nxt == '/':
                      state = 'line'
                      i += 1
                  elif ch == '#':
                      state = 'line'
                  elif ch == '/' and nxt == '*':
                      state = 'block'
                      i += 1
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1

              raise RuntimeError('Function end not found')

          helpers_path = Path('core/components/training/processors/web/_helpers.php')
          helpers = helpers_path.read_text(encoding='utf-8')
          marker = 'TRAINING_FIRST_INCOMPLETE_VIDEO_FIX_V1'

          replacement = '''public static function getPreferredLessonVideoId(modX $modx, $courseId, $lessonId, $userId, $requestedVideoId = 0)
              {
                  // TRAINING_FIRST_INCOMPLETE_VIDEO_FIX_V1
                  $courseId = (int)$courseId;
                  $lessonId = (int)$lessonId;
                  $userId = (int)$userId;
                  $requestedVideoId = (int)$requestedVideoId;

                  $rows = self::fetchLessonVideos($modx, $lessonId, true);
                  if (empty($rows)) {
                      return 0;
                  }

                  $progressMap = self::getLessonVideoProgressMap(
                      $modx,
                      $courseId,
                      $lessonId,
                      $userId
                  );

                  /** @var TrainingCourse|null $course */
                  $course = $modx->getObject('TrainingCourse', array('id' => $courseId));
                  $isSequential = $course
                      ? ((int)$course->get('is_sequential') === 1)
                      : true;

                  $videoIndexes = array();
                  $firstIncompleteVideoId = 0;
                  $firstIncompleteIndex = -1;

                  foreach ($rows as $index => $row) {
                      $videoId = (int)$row['id'];
                      $videoIndexes[$videoId] = $index;

                      $progress = isset($progressMap[$videoId])
                          ? $progressMap[$videoId]
                          : array();

                      $completed = $progress
                          && !empty($progress['completed']);

                      if (
                          $isSequential
                          && $firstIncompleteVideoId <= 0
                          && !$completed
                      ) {
                          $firstIncompleteVideoId = $videoId;
                          $firstIncompleteIndex = $index;
                      }
                  }

                  if ($requestedVideoId > 0 && isset($videoIndexes[$requestedVideoId])) {
                      if (
                          !$isSequential
                          || $firstIncompleteVideoId <= 0
                          || $videoIndexes[$requestedVideoId] <= $firstIncompleteIndex
                      ) {
                          return $requestedVideoId;
                      }

                      return $firstIncompleteVideoId;
                  }

                  if ($isSequential && $firstIncompleteVideoId > 0) {
                      return $firstIncompleteVideoId;
                  }

                  if (self::hasUserVideoProgressTable($modx)) {
                      $sql = 'SELECT p.`lesson_video_id` FROM `' . self::userVideoProgressTable($modx) . '` p '
                          . 'INNER JOIN `' . self::lessonVideosTable($modx) . '` lv ON lv.`id` = p.`lesson_video_id` AND lv.`is_active` = 1 '
                          . 'WHERE p.`course_id` = :course_id AND p.`lesson_id` = :lesson_id AND p.`user_id` = :user_id '
                          . 'ORDER BY COALESCE(p.`last_watch`, \'0000-00-00 00:00:00\') DESC, p.`max_time` DESC, p.`current_time` DESC, p.`id` DESC LIMIT 1';

                      $stmt = $modx->prepare($sql);

                      if ($stmt && $stmt->execute(array(
                          ':course_id' => $courseId,
                          ':lesson_id' => $lessonId,
                          ':user_id' => $userId,
                      ))) {
                          $value = (int)$stmt->fetchColumn();

                          if ($value > 0 && isset($videoIndexes[$value])) {
                              return $value;
                          }
                      }
                  }

                  foreach ($rows as $row) {
                      if (!empty($row['is_default'])) {
                          return (int)$row['id'];
                      }
                  }

                  $first = reset($rows);

                  return $first ? (int)$first['id'] : 0;
              }'''

          if marker not in helpers:
              start, end = function_range(
                  helpers,
                  'public static function getPreferredLessonVideoId'
              )
              helpers = helpers[:start] + replacement + helpers[end:]
              helpers_path.write_text(helpers, encoding='utf-8')

          app_path = Path('theme/js/app-training.js')
          app = app_path.read_text(encoding='utf-8')
          app_marker = "? (res.object.nav.next_url || '')"

          new_handler = '''                .off('ended.appTrainingPlayer')
                          .on('ended.appTrainingPlayer', function () {
                              updatePlayUi();
                              stopSaveInterval();
                              completeSent = true;

                              var nextVideoId = getAdjacentVideoId('next');

                              saveProgress(true, {silent: true, skipUiSync: false});

                              if (nextVideoId > 0) {
                                  setTimeout(function () {
                                      switchToVideo(nextVideoId, {});
                                  }, 120);

                                  return;
                              }

                              if (saveXhr && typeof saveXhr.done === 'function') {
                                  saveXhr.done(function (res) {
                                      var nextUrl = res
                                          && res.success
                                          && res.object
                                          && res.object.nav
                                          ? (res.object.nav.next_url || '')
                                          : '';

                                      if (!nextUrl) {
                                          return;
                                      }

                                      setTimeout(function () {
                                          openPlayerUrl(nextUrl, 'Следующий урок пока недоступен.');
                                      }, 120);
                                  });
                              }
                          })
'''

          if app_marker not in app:
              start_marker = "                .off('ended.appTrainingPlayer')"
              end_marker = "                .off('volumechange.appTrainingPlayer')"
              start = app.index(start_marker)
              end = app.index(end_marker, start)
              app = app[:start] + new_handler + app[end:]
              app_path.write_text(app, encoding='utf-8')

      - name: Validate syntax
        run: |
          php -l core/components/training/processors/web/_helpers.php
          node --check theme/js/app-training.js

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/components/training/processors/web/_helpers.php theme/js/app-training.js
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "fix: preserve sequential lesson progression"
          git push origin HEAD:sync/server-working-20260627
